name: Test & Deploy to GitHub Pages

# Triggers:
# - push to main: run the unit tests first, then publish (⚠️ a push goes live — this is the
#   step that decides when the surprise becomes readable)
# - manual: Actions tab → this workflow → Run workflow
on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege needed to deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel one that is already running
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ① Tests: no deploy unless they pass
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24' # matches local; Node 24 detects ESM without a package.json
      - name: Run unit tests
        run: node --test "tests/**/*.test.js"

  # ② Deploy: only after test succeeds
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: . # the repo root is the site (.nojekyll already turns Jekyll processing off)
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
