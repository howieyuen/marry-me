name: Test & Deploy to GitHub Pages

# 触发时机：
# - push 到 main：先跑单测，通过后自动部署上线（⚠️ push 即上线，是防剧透的关键动作）
# - 手动触发：Actions 页面 → 本 workflow → Run workflow
on:
  push:
    branches: [main]
  workflow_dispatch:

# GitHub Pages 部署所需的最小权限
permissions:
  contents: read
  pages: write
  id-token: write

# 避免并发部署互相打架；不取消进行中的部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ① 单测：不通过就不部署
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24' # 与本地一致；Node 24 自动识别 ESM，无需 package.json
      - name: Run unit tests
        run: node --test "tests/**/*.test.js"

  # ② 部署：依赖 test 成功
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: . # 整个仓库根目录作为静态站点（.nojekyll 已关闭 Jekyll 处理）
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
